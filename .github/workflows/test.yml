name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        otp: ["27", "28", "29"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: "1.19.1"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam test
      - run: gleam format --check src test
      - run: ./build_escript.sh
      - run: bash scripts/test_artifact.sh

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # the upgrade/rollback gate builds the previous tag in a worktree
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          gleam-version: "1.19.1"
          rebar3-version: "3"
      - uses: borkdude/setup-babashka@v5
      - run: gleam deps download
      - run: ./build_escript.sh
      - run: bb scripts/test_release_contract.clj
      - run: bb scripts/test_upgrade_rollback.clj
